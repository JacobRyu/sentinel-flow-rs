# Local Kafka + ClickHouse for the Phase 6 kafka transport mode (manual E2E;
# not part of CI). Topic netflow.raw is created by hand — see
# docs/runbooks/kafka-replay.md.
services:
  kafka:
    # Bitnami pulled bitnami/kafka:3.7 from Docker Hub; the frozen legacy
    # mirror keeps the same KAFKA_CFG_* env vars and /opt/bitnami paths.
    image: bitnamilegacy/kafka:3.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "8123:8123"
    environment:
      # The image otherwise restricts the passwordless `default` user to
      # localhost, which rejects the sink connecting from the host.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
