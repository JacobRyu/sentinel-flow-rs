[workspace]
members = [
    "crates/sentinel-sensor",
    "crates/sentinel-parser",
    "crates/sentinel-flow",
    "crates/sentinel-detection",
    "crates/sentinel-enrichment",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/JacobRyu/sentinel-flow-rs"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bincode = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
prometheus = { version = "0.13", features = ["process"] }

# Configuration
config = "0.13"
clap = { version = "4", features = ["derive"] }

# Network
pnet = "0.34"
socket2 = "0.5"

# Storage
clickhouse = { version = "0.11", features = ["time", "uuid"] }

# Kubernetes
kube = { version = "0.87", features = ["client", "derive"] }
k8s-openapi = { version = "0.21", features = ["v1_28"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
parking_lot = "0.12"
bytes = "1"
rand = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
