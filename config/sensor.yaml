capture:
  interface: eth0
  buffer_size: 4096
  snap_len: 65535

flow:
  inactive_timeout_secs: 30
  active_timeout_secs: 300
  max_flows: 100000

output:
  mode: direct
  clickhouse_url: "http://localhost:8123"
  clickhouse_database: "sentinel"
  batch_size: 1000
  batch_timeout_ms: 500
  kafka:
    brokers:
      - localhost:9092
    topic: netflow.raw

detection:
  enabled: true
  rules_path: "config/detection-rules.yaml"
  event_channel_capacity: 1000

metrics:
  enabled: true
  port: 9090

kubernetes:
  enabled: false
